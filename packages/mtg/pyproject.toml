[build-system]
requires = ["setuptools>=77"]     # >=77 for PEP 639 (SPDX `license` + `license-files`)
build-backend = "setuptools.build_meta"

[project]
name = "python-mtg"
version = "0.1.1"
description = "A python-chess-style API + driver for an MTG rules engine (runs the Datalog/souffle build)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yevbar" }]
keywords = ["mtg", "magic", "the", "gathering", "rules-engine", "datalog", "souffle"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
# The base API is a thin pydantic layer over an in-process compiled souffle .so run over the bundled Datalog
# build. A wheel ships the .so + the datalog/ + corpus data (staged by packaging/prepare_wheel.py), so
# `pip install python-mtg` works with no souffle/toolchain. (The parser side — mtg.analysis — needs the
# separate `interpreter` package and isn't shipped in the wheel.)
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
# Parser/tooling side (card-text interpretation, the card_synergy buff graph). Not needed for the base API.
parser = ["networkx"]
# Visualization of the card_synergy graph (render_full.py): community layout + plotting. Tooling only.
viz = ["networkx", "igraph", "matplotlib"]
# Self-play learning: the numpy value net (rebel_train) and the PyTorch card-aware value net (cardnet).
learn = ["numpy", "torch"]

[project.urls]
Homepage = "https://github.com/yevbar/witchcraft"

# The package directory IS packages/mtg/ (this file's directory), so map the `mtg` package to ".".
# mtg.analysis is intentionally NOT shipped — it imports the separate `interpreter` package.
# effect_handlers/ + engine_handlers/ are TOP-LEVEL packages the engine imports by name (the driver's and
# engine's pluggable verb registries); they live at the repo root, so map them via a relative package-dir.
# (Tech debt: they'd ideally be vendored under mtg.* — tracked for a follow-up; top-level works for now.)
[tool.setuptools]
packages = ["mtg", "mtg.engine", "effect_handlers", "engine_handlers"]
package-dir = { "mtg" = ".", "effect_handlers" = "../../effect_handlers", "engine_handlers" = "../../engine_handlers" }

[tool.setuptools.package-data]
# Bundled at build time by packaging/prepare_wheel.py: the Datalog build, the oracle corpus, and the
# per-arch compiled engine .so — so the installed wheel runs with no souffle / no C++ toolchain.
mtg = [
    "decks/*.txt",              # bundled limited-style deck lists (load_deck)
    "_datalog/*.dl",
    "_datalog/rules_version.json",           # the compiled Datalog build the engine reads at runtime
    "_data/*.json",            # oracle_corpus.json (card characteristics)
    "_native/*.so",            # the in-process engine, untagged (macOS universal2 — serves both arches)
    "_native/*/*.so",          # or under a platform-tag dir (e.g. linux_x86_64/)
]
