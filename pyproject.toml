# witchcraft — monorepo root (not itself an installable package).
#
# Installable packages live under packages/:
#   packages/mtg         — python-mtg: the engine driver + python-chess-style API
#                          (see packages/mtg/pyproject.toml)
#   packages/inthearena  — the MTG Arena bridge (see packages/inthearena/pyproject.toml)
#
# Repo-level (not packaged here):
#   interpreter/  — the English -> Datalog transpiler (produces the souffle build)
#   datalog/      — the generated Datalog build artifact that mtg drives
#
# Everything currently runs from the repo root via sys.path (install is deferred); each entry point puts
# the repo root and packages/ on sys.path. See packages/mtg/pyproject.toml for the package build config.
