[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "inthearena"
version = "0.0.1"
description = "Research bridge for driving Magic: The Gathering agents from MTG Arena game logs (see DISCLAIMER.md)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "yevbar" }]
keywords = ["arena", "agents", "placeholder"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
]
# the mtga bridge parses the GRE log into typed models
dependencies = ["pydantic>=2"]

# Opt-in ONLY: drive the live MTGA client (mouse/keyboard automation). This is against MTGA's Terms of Service
# and can get an account banned (see DISCLAIMER.md). The base package never imports it; navigation defaults to
# a no-op DryRunActuator. `pip install inthearena[act]`.
[project.optional-dependencies]
act = ["pyautogui"]
# Opt-in: a small local vision model (Moondream) to locate buttons on screen instead of coordinate estimates.
vision = ["moondream", "pillow"]

[project.urls]
Homepage = "https://github.com/yevbar"

[tool.setuptools.packages.find]
where = ["src"]
